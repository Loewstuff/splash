<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Pawsome</title>
  <meta name="description" content="Something tail-waggingly awesome is coming soon. Get notified when we launch.">
  <style>
    :root {
      /* Michigan sunset inspired palette */
      --deep-blue: #0F2C4A;
      --navy: #1E3A5F;
      --gold: #D4A017;
      --gold-bright: #E8B84A;
      --gold-light: #F2D070;
      --bg: #F9F6F0;
      --surface: #FFFFFF;
      --text-primary: #0F2C4A;
      --text-secondary: #4B5563;
      --border: #E5D9C4;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Premium top countdown */
    .countdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--deep-blue);
      color: #fff;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
      box-shadow: 0 4px 12px -2px rgba(15, 44, 74, 0.3);
    }

    .countdown-label {
      opacity: 0.85;
      font-weight: 500;
    }

    .countdown-value {
      font-weight: 700;
      color: var(--gold-bright);
      font-variant-numeric: tabular-nums;
    }

    /* Brand */
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 16px;
    }

    /* Hero Image - cinematic treatment */
    .hero-wrapper {
      position: relative;
      margin-bottom: 36px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(15, 44, 74, 0.25),
                  0 10px 25px -10px rgba(15, 44, 74, 0.15);
    }

    .hero {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    /* Content */
    .content {
      text-align: center;
    }

    .headline {
      font-size: clamp(2.6rem, 7.5vw, 3.9rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin: 0 0 12px;
      color: var(--deep-blue);
    }

    .tagline {
      font-size: clamp(1.1rem, 3.2vw, 1.32rem);
      font-weight: 500;
      color: var(--text-secondary);
      max-width: 28ch;
      margin: 0 auto 32px;
      line-height: 1.5;
    }

    /* Signup form - premium styling */
    .signup {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 26px 32px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px -10px rgba(15, 44, 74, 0.08);
    }

    .signup-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--deep-blue);
      margin-bottom: 12px;
      text-align: left;
    }

    .form {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .form {
        flex-direction: row;
      }
    }

    .email-input {
      flex: 1;
      padding: 15px 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #FFFBF5;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .email-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.12);
    }

    .email-input::placeholder {
      color: #A89F92;
    }

    .submit-btn {
      padding: 15px 28px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--gold);
      color: #0F2C4A;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 4px 14px -2px rgba(212, 160, 23, 0.35);
      font-family: inherit;
    }

    .submit-btn:hover {
      background: var(--gold-bright);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px -2px rgba(212, 160, 23, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Success state */
    .success {
      display: none;
      text-align: center;
      padding: 8px 0;
    }

    .success.visible {
      display: block;
    }

    .success-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .success-icon {
      font-size: 38px;
      line-height: 1;
    }

    .success-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--deep-blue);
    }

    .success-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 26ch;
    }

    .disclaimer {
      font-size: 0.78rem;
      color: #8B7D6B;
      margin-top: 14px;
      text-align: center;
    }

    /* Clean footer */
    .footer {
      font-size: 0.8rem;
      color: #8B7D6B;
      text-align: center;
      padding-top: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #8B7D6B;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--deep-blue);
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      .page {
        padding: 24px 16px 40px;
      }
      
      .countdown {
        font-size: 0.8rem;
        padding: 8px 16px;
        margin-bottom: 24px;
      }
      
      .headline {
        font-size: 2.35rem;
      }
      
      .signup {
        padding: 22px 20px 26px;
      }
      
      .hero-wrapper {
        margin-bottom: 28px;
        border-radius: 12px;
      }
    }

    /* Subtle entrance animation */
    .page > * {
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .hero-wrapper { animation-delay: 80ms; }
    .headline { animation-delay: 160ms; }
    .tagline { animation-delay: 220ms; }
    .signup { animation-delay: 280ms; }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page > * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 
    ================================================
    PAWSOME COMING SOON — UPDATED PROFESSIONAL SPLASH
    ================================================
    
    HERO IMAGE (Grok Imagine generated):
    - A happy golden retriever walking a Michigan beach at sunset
    - Warm golden hour, soft orange/pink sky, photorealistic
    - File is saved locally as: hero.jpg (already copied into this folder)
    
    TO USE THIS SINGLE-FILE PAGE:
    1. Make sure hero.jpg is in the same folder as index.html
    2. Customize "Pawsome" (brand) in a few places
    3. Change the launch date in the JavaScript below (search for "launchDate")
    4. Update footer links and copyright year as needed
    
    This version features:
    - Michigan sunset color palette (deep blue + warm gold)
    - Cinematic Grok-generated hero image
    - Live countdown timer
    - Premium typography and spacing
    - Fully responsive + mobile first
    - Still 100% single HTML file (embedded CSS + JS)
  -->

  <div class="page">
    <!-- Dynamic Countdown -->
    <div class="countdown" id="countdown-container">
      <span class="countdown-label">Launching in</span>
      <span class="countdown-value" id="countdown">—</span>
    </div>

    <!-- Brand -->
    <div class="brand">PAWSOME</div>

    <!-- Cinematic Hero Image -->
    <div class="hero-wrapper">
      <img 
        src="hero.jpg" 
        alt="A happy golden retriever walking along a Michigan beach at sunset with warm golden hour lighting, gentle waves, and a soft orange and pink sky"
        class="hero"
        width="1600"
        height="900"
      >
    </div>

    <!-- Main Content -->
    <div class="content">
      <h1 class="headline">Coming Soon</h1>
      
      <p class="tagline">Pawsitively fetching something awesome…</p>

      <!-- Email Signup -->
      <div class="signup">
        <div id="form-view">
          <label for="email" class="signup-label">Get notified when we launch</label>
          
          <form id="notify-form" class="form" novalidate>
            <input 
              type="email" 
              id="email" 
              class="email-input" 
              placeholder="you@awesome.com" 
              required
              aria-label="Email address for launch notification"
            >
            <button type="submit" class="submit-btn">Notify me</button>
          </form>
          
          <p class="disclaimer">No spam. Just a friendly heads-up when we’re live.</p>
        </div>

        <!-- Success State -->
        <div id="success-view" class="success">
          <div class="success-content">
            <div class="success-icon">🐾</div>
            <div class="success-title">You’re on the list!</div>
            <div class="success-subtitle">We’ll send you a note the moment we launch.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Clean Footer -->
    <footer class="footer">
      <div>© 2026 Pawsome. All rights reserved.</div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </footer>
  </div>

  <script>
    // ============================================
    // CONFIGURATION - Easy to edit
    // ============================================
    const LAUNCH_DATE = new Date('2026-04-25T00:00:00'); // ← Change this date to your actual launch date

    // Live Countdown Timer
    function updateCountdown() {
      const now = new Date();
      const diff = LAUNCH_DATE - now;

      const container = document.getElementById('countdown-container');
      const valueEl = document.getElementById('countdown');

      if (diff <= 0) {
        valueEl.textContent = 'very soon';
        container.style.background = 'var(--navy)';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      let text = '';
      if (days > 0) {
        text = `${days} day${days !== 1 ? 's' : ''}`;
        if (hours > 0) text += `, ${hours} hr${hours !== 1 ? 's' : ''}`;
      } else if (hours > 0) {
        text = `${hours} hour${hours !== 1 ? 's' : ''}`;
      } else {
        text = 'less than an hour';
      }

      valueEl.textContent = text;
    }

    // Update countdown immediately and every minute
    updateCountdown();
    setInterval(updateCountdown, 60000);

    // ============================================
    // Email Signup Form (placeholder)
    // ============================================
    const form = document.getElementById('notify-form');
    const formView = document.getElementById('form-view');
    const successView = document.getElementById('success-view');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const emailField = document.getElementById('email');

      if (!emailField.checkValidity()) {
        emailField.reportValidity();
        return;
      }

      // TODO: Replace this with real API call (e.g. Buttondown, ConvertKit, custom endpoint)
      formView.style.transition = 'opacity 0.2s ease';
      formView.style.opacity = '0';

      setTimeout(() => {
        formView.style.display = 'none';
        successView.classList.add('visible');
      }, 220);
    });

    // Keyboard accessibility nicety
    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement.tagName === 'BODY') {
        const email = document.getElementById('email');
        if (email) {
          e.preventDefault();
          email.focus();
        }
      }
    });
  </script>
</body>
</html>
