<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Pawsome</title>
  <meta name="description" content="Something tail-waggingly awesome is coming soon. Get notified when we launch.">
  <style>
    :root {
      --gold: #D4A017;
      --gold-light: #E8C670;
      --text-primary: #2C2520;
      --text-secondary: #5F564D;
      --bg: linear-gradient(135deg, #FBF7F0 0%, #F5EDE1 100%);
      --surface: #FFFBF5;
      --border: #EDE4D8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }

    .splash {
      width: 100%;
      max-width: 680px;
      text-align: center;
      animation: page-enter 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes page-enter {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash { animation: none; }
      .hero { animation: none !important; }
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
      opacity: 0.95;
    }

    .hero {
      width: 100%;
      max-width: 470px;
      margin: 0 auto 42px;
      display: block;
      border-radius: 22px;
      border: 12px solid #FFFBF5;
      box-shadow: 0 30px 70px -18px rgba(44, 37, 32, 0.22),
                  0 12px 30px -8px rgba(44, 37, 32, 0.14);
      animation: hero-enter 1s cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
    }

    @keyframes hero-enter {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .headline {
      font-size: clamp(2.85rem, 8.5vw, 4.4rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: clamp(1.15rem, 3.1vw, 1.38rem);
      font-weight: 500;
      color: var(--text-secondary);
      max-width: 26ch;
      margin: 0 auto 38px;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 28px 32px;
      margin-bottom: 52px;
      box-shadow: 0 10px 35px -12px rgba(44, 37, 32, 0.09);
    }

    .form-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .form-row { flex-direction: row; }
    }

    .email-input {
      flex: 1;
      padding: 15px 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #FFFBF5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .email-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.13);
    }

    .submit-btn {
      padding: 15px 32px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--gold);
      color: #2C2520;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px -2px rgba(212, 160, 23, 0.4);
    }

    .submit-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .submit-btn:active { transform: translateY(0); }

    .success {
      display: none;
      padding: 8px 0;
    }

    .success.visible { display: block; }

    .success-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .success-check {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 2px;
    }

    .success-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .success-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 28ch;
    }

    .disclaimer {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #A89F92;
    }

    .footer {
      font-size: 0.78rem;
      color: #A89F92;
    }

    .footer-links {
      margin-top: 6px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
    }

    .footer-links a:hover { color: var(--gold); }

    @media (max-width: 480px) {
      .hero { max-width: 300px; border-width: 8px; }
      .form-card { padding: 22px 20px 26px; }
    }
  </style>
</head>
<body>
  <!-- 
    ============================================
    PAWSOME COMING SOON SPLASH PAGE
    ============================================
    HOW TO CUSTOMIZE (no coding skills needed):
    1. Search & replace "Pawsome" with your brand name
    2. Replace the <img src="..."> with your own golden retriever photo (see PROMPT.md for recommendations)
    3. Update the year and footer links
    4. (Optional) Change <title> and meta description
    ============================================
  -->

  <div class="splash">
    <!-- Brand -->
    <div class="brand">PAWSOME</div>

    <!-- Hero Image -->
    <img 
      src="https://images.pexels.com/photos/204493/pexels-photo-204493.jpeg?auto=compress&cs=tinysrgb&w=900" 
      alt="A very cute, happy golden retriever with a friendly expression looking directly at the camera" 
      class="hero"
      width="900"
      height="600"
    >

    <!-- Headline -->
    <h1 class="headline">Coming Soon</h1>

    <!-- Exact tagline -->
    <p class="tagline">Pawsitively fetching something awesome...</p>

    <!-- Email Signup -->
    <div class="form-card">
      <div id="form-view">
        <label for="email" class="form-label">Get notified when we launch</label>
        
        <form id="notify-form" class="form-row" novalidate>
          <input 
            type="email" 
            id="email" 
            class="email-input" 
            placeholder="you@awesome.com" 
            required
          >
          <button type="submit" class="submit-btn">Notify me</button>
        </form>
        
        <p class="disclaimer">No spam. Just the good stuff and a heads-up when we launch.</p>
      </div>

      <!-- Success state (shown via JS) -->
      <div id="success-view" class="success">
        <div class="success-inner">
          <div class="success-check">🐾</div>
          <div class="success-title">You're on the list!</div>
          <div class="success-subtitle">We'll send you a tail-wagging email the moment we launch.</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div>© 2026 Pawsome. All rights reserved.</div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </footer>
  </div>

  <script>
    // Lightweight placeholder form handler — replace with real API call when ready
    const form = document.getElementById('notify-form');
    const formView = document.getElementById('form-view');
    const successView = document.getElementById('success-view');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const emailField = document.getElementById('email');
      if (!emailField.checkValidity()) {
        emailField.reportValidity();
        return;
      }

      // In production: send emailField.value to your mailing list / backend here
      formView.style.transition = 'opacity 0.2s ease';
      formView.style.opacity = '0';

      setTimeout(() => {
        formView.style.display = 'none';
        successView.classList.add('visible');
      }, 220);
    });
  </script>
</body>
</html>
