<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Pawsome</title>
  <meta name="description" content="Coming soon. Local 7-day weather forecast for Hudsonville, Michigan.">
  <style>
    :root {
      /* Michigan sunset inspired palette */
      --deep-blue: #0F2C4A;
      --navy: #1E3A5F;
      --gold: #D4A017;
      --gold-bright: #E8B84A;
      --gold-light: #F2D070;
      --bg: #F9F6F0;
      --surface: #FFFFFF;
      --text-primary: #0F2C4A;
      --text-secondary: #4B5563;
      --border: #E5D9C4;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Premium top countdown */
    .countdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--deep-blue);
      color: #fff;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
      box-shadow: 0 4px 12px -2px rgba(15, 44, 74, 0.3);
    }

    .countdown-label {
      opacity: 0.85;
      font-weight: 500;
    }

    .countdown-value {
      font-weight: 700;
      color: var(--gold-bright);
      font-variant-numeric: tabular-nums;
    }

    /* Brand */
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 16px;
    }

    /* Hero Image - cinematic treatment */
    .hero-wrapper {
      position: relative;
      margin-bottom: 36px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(15, 44, 74, 0.25),
                  0 10px 25px -10px rgba(15, 44, 74, 0.15);
    }

    .hero {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    /* Content */
    .content {
      text-align: center;
    }

    .headline {
      font-size: clamp(2.6rem, 7.5vw, 3.9rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin: 0 0 12px;
      color: #C41E3A;
    }

    .tagline {
      font-size: clamp(1.1rem, 3.2vw, 1.32rem);
      font-weight: 500;
      color: var(--text-secondary);
      max-width: 28ch;
      margin: 0 auto 32px;
      line-height: 1.5;
    }

    /* 7-Day Forecast - Hudsonville, MI (small & clean) */
    .forecast {
      margin-bottom: 32px;
    }

    .forecast-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 3px;
      text-align: center;
      font-size: 0.7rem;
    }

    .day-name {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 1px;
    }

    .day-icon {
      font-size: 1rem;
      line-height: 1;
      margin: 1px 0;
    }

    .day-temps {
      font-size: 0.65rem;
      line-height: 1.1;
    }

    .day-temps .high {
      font-weight: 600;
      color: var(--deep-blue);
    }

    .day-temps .low {
      color: #8B7D6B;
    }

    /* Clean footer */
    .footer {
      font-size: 0.8rem;
      color: #8B7D6B;
      text-align: center;
      padding-top: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #8B7D6B;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--deep-blue);
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      .page {
        padding: 24px 16px 40px;
      }
      
      .countdown {
        font-size: 0.8rem;
        padding: 8px 16px;
        margin-bottom: 24px;
      }
      
      .headline {
        font-size: 2.35rem;
      }
      
      .hero-wrapper {
        margin-bottom: 28px;
        border-radius: 12px;
      }
      
      .forecast-grid {
        gap: 4px;
      }
      
      .day {
        padding: 5px 2px;
        font-size: 0.65rem;
      }
      
      .day-icon {
        font-size: 0.9rem;
      }
    }

    /* Subtle entrance animation */
    .page > * {
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .hero-wrapper { animation-delay: 80ms; }
    .headline { animation-delay: 160ms; }
    .tagline { animation-delay: 220ms; }
    .forecast { animation-delay: 280ms; }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page > * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 
    ================================================
    PAWSOME COMING SOON — UPDATED PROFESSIONAL SPLASH
    ================================================
    
    HERO IMAGE (Grok Imagine generated):
    - A happy golden retriever walking a Michigan beach at sunset
    - Warm golden hour, soft orange/pink sky, photorealistic
    - File is saved locally as: hero.jpg (already copied into this folder)
    
    TO USE THIS SINGLE-FILE PAGE:
    1. Make sure hero.jpg is in the same folder as index.html
    2. Customize "Pawsome" (brand) in a few places
    3. Change the launch date in the JavaScript below (search for "launchDate")
    4. Update footer links and copyright year as needed
    
    This version features:
    - Michigan sunset color palette (deep blue + warm gold)
    - Cinematic Grok-generated hero image
    - Live countdown timer
    - Small 7-day weather forecast for Hudsonville, MI
    - Premium typography and spacing
    - Fully responsive + mobile first
    - Still 100% single HTML file (embedded CSS + JS)
    - No email signup form (removed per request)
  -->

  <div class="page">
    <!-- Dynamic Countdown -->
    <div class="countdown" id="countdown-container">
      <span class="countdown-label">Launching in</span>
      <span class="countdown-value" id="countdown">—</span>
    </div>

    <!-- Brand -->
    <div class="brand">PAWSOME</div>

    <!-- Cinematic Hero Image -->
    <div class="hero-wrapper">
      <img 
        src="hero.jpg" 
        alt="A happy golden retriever walking along a Michigan beach at sunset with warm golden hour lighting, gentle waves, and a soft orange and pink sky"
        class="hero"
        width="1600"
        height="900"
      >
    </div>

    <!-- Main Content -->
    <div class="content">
      <h1 class="headline">Coming Soon</h1>
      
      <p class="tagline">Pawsitively fetching something awesome…</p>

      <!-- Local 7-Day Weather Forecast for Hudsonville, MI -->
      <div class="forecast">
        <div class="forecast-title">Hudsonville, MI • 7-Day Forecast</div>
        <div class="forecast-grid" id="forecast-grid"></div>
      </div>
    </div>

    <!-- Clean Footer -->
    <footer class="footer">
      <div>© 2026 Pawsome. All rights reserved.</div>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </footer>
  </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const LAUNCH_DATE = new Date('2026-04-25T00:00:00'); // ← Change this date to your actual launch date

    // Live Countdown Timer
    function updateCountdown() {
      const now = new Date();
      const diff = LAUNCH_DATE - now;

      const container = document.getElementById('countdown-container');
      const valueEl = document.getElementById('countdown');

      if (diff <= 0) {
        valueEl.textContent = 'very soon';
        container.style.background = 'var(--navy)';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      let text = '';
      if (days > 0) {
        text = `${days} day${days !== 1 ? 's' : ''}`;
        if (hours > 0) text += `, ${hours} hr${hours !== 1 ? 's' : ''}`;
      } else if (hours > 0) {
        text = `${hours} hour${hours !== 1 ? 's' : ''}`;
      } else {
        text = 'less than an hour';
      }

      valueEl.textContent = text;
    }

    // Update countdown immediately and every minute
    updateCountdown();
    setInterval(updateCountdown, 60000);

    // ============================================
    // 7-Day Forecast for Hudsonville, MI
    // Hardcoded realistic sample data (no external API)
    // ============================================
    function renderForecast() {
      const grid = document.getElementById('forecast-grid');
      if (!grid) return;

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      // Plausible Hudsonville / West Michigan weather
      const data = [
        { emoji: '☀️', high: 64, low: 42 },
        { emoji: '🌤️', high: 59, low: 39 },
        { emoji: '⛅', high: 55, low: 38 },
        { emoji: '🌦️', high: 52, low: 41 },
        { emoji: '☀️', high: 61, low: 43 },
        { emoji: '🌤️', high: 66, low: 46 },
        { emoji: '☀️', high: 70, low: 48 }
      ];

      const today = new Date();
      grid.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() + i);
        const dayName = dayNames[date.getDay()];
        const item = data[i];

        const el = document.createElement('div');
        el.className = 'day';
        el.innerHTML = `
          <div class="day-name">${i === 0 ? 'Today' : dayName}</div>
          <div class="day-icon">${item.emoji}</div>
          <div class="day-temps">
            <span class="high">${item.high}°</span>
            <span class="low">${item.low}°</span>
          </div>
        `;
        grid.appendChild(el);
      }
    }

    // Initialize forecast
    renderForecast();
  </script>
</body>
</html>
